<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connect WhatsApp Business — Workforce 2.0</title>
<link rel="stylesheet" href="/assets/site.css">
</head><body>
<main id="main"><section class="hero"><div class="wrap">
<h1>Connect WhatsApp Business</h1>
<p class="lead">Workforce sends your CRM campaigns through your own WhatsApp Business account. Meta's window asks you to choose
or create the account, add your number and verify it. Meta bills your account directly for the messages.</p>
<div class="cta-row" style="margin-top:26px"><button class="btn btn-primary" id="go" disabled>Continue with Facebook</button></div>
<p class="lead" id="say" style="margin-top:18px"></p>
</div></section></main>
<script>
// Embedded Signup (v4) for Workforce, a Meta Tech Provider. Opened from the desktop app with app, config, state, ret
// (its own 127.0.0.1 address) and coex (the number stays on the WhatsApp Business app). The code from FB.login and
// the account from Meta's WA_EMBEDDED_SIGNUP message arrive in either order; once both are in, the code (valid
// 30 seconds) goes to the wa-signup function, and the account it returns is handed to the desktop app.
var q = new URLSearchParams(location.search), app = q.get("app"), cfg = q.get("config"), state = q.get("state") || "", coex = q.get("coex") === "1";
var ret = q.get("ret") || "", code = null, info = null;
var say = function (t) { document.getElementById("say").textContent = t; };
if (!/^http:\/\/127\.0\.0\.1:\d+\/api\/wa-cloud\/callback$/.test(ret) || !/^\d+$/.test(app || "") || !/^\d+$/.test(cfg || "")) say("Open this page from Workforce: Settings, Connections, WhatsApp Business.");
window.addEventListener("message", function (e) {
  var host = ""; try { host = new URL(e.origin).hostname; } catch (x) {}
  if (!/(^|\.)facebook\.com$/.test(host)) return;
  var d; try { d = JSON.parse(e.data); } catch (x) { return; }
  if (!d || d.type !== "WA_EMBEDDED_SIGNUP") return;
  if (d.event === "CANCEL" || (d.data && d.data.current_step)) return say((d.data && d.data.error_message) || "Sign-up was not finished. Press Continue to try again.");
  if (d.event === "ERROR") return say("Meta reported an error: " + ((d.data && d.data.error_message) || "unknown"));
  if (/^FINISH/.test(d.event || "")) { info = d.data; finish(); }
});
function finish() {
  if (!code || !info) return;
  var c = code; code = null; say("Connecting your account…");
  fetch("https://ieqkozrcbdecnhbyqhhd.supabase.co/functions/v1/wa-signup", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: c, waba_id: info.waba_id, phone_number_id: info.phone_number_id, business_id: info.business_id, coex: coex }) })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r || !r.ok) return say("Could not connect: " + ((r && r.error) || "no answer") + ". Press Continue to try again.");
      var b = btoa(unescape(encodeURIComponent(JSON.stringify(r)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      location.href = ret + "?state=" + encodeURIComponent(state) + "&r=" + b;
    })
    .catch(function () { say("Could not reach Workforce's server. Press Continue to try again."); });
}
window.fbAsyncInit = function () {
  FB.init({ appId: app, autoLogAppEvents: true, xfbml: false, version: "v25.0" });
  var go = document.getElementById("go"); go.disabled = false;
  go.onclick = function () {
    say("");
    FB.login(function (r) { if (r.authResponse && r.authResponse.code) { code = r.authResponse.code; finish(); } else say("Sign-up was not finished. Press Continue to try again."); },
      { config_id: cfg, response_type: "code", override_default_response_type: true,
        extras: Object.assign({ setup: {}, sessionInfoVersion: "3", version: "v4" }, coex ? { featureType: "whatsapp_business_app_onboarding" } : {}) });
  };
};
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</body></html>
