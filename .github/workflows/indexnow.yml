name: Notify IndexNow
on:
  push:
    branches: [main]
    paths: ['**/*.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .website/indexnow.mjs --test
      - name: Submit live page changes
        env:
          BEFORE: ${{ github.event.before }}
        run: node .website/indexnow.mjs ${BEFORE:+"$BEFORE"}
